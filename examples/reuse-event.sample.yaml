      - payment_sent
      - settlement_completed

  safety_notes:
    - Reuse does not automatically prove legal derivation.
    - Reuse does not determine legal ownership.
    - Reuse does not execute payment.
    - Similarity should be distinguished from coincidence or generic patterns.
    - Reuse events should preserve trace context.
    - Reuse events should remain review-aware and dispute-aware.
