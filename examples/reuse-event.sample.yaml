      - legal_claim
      - final_allocation
    note: >
      Reuse events may strongly support allocation candidates when combined
      with citation, influence, trace quality, or review outcomes. They should
      not directly trigger payment.

  lifecycle:
    current_state: classified_as_event
    allowed_next_states:
      - pending_review
      - approved
      - aggregated
      - disputed
      - rejected
      - superseded
      - allocation_candidate
    not_allowed_next_states_without_review:
