royalty_event:
  event_id: evt_influence_2026_05_20_001
  version: "0.1.0"
  status: sample

  event_type: influence

  description: >
    Sample influence event representing that a source, structure, idea,
    artifact, specification, or conceptual framework may have influenced
    a downstream artifact, model output, system design, or document.

  source:
    source_reference: source_kazene_spec_001
    source_type: specification
